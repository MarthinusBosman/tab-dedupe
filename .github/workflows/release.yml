name: Release

# Push a tag matching the manifest version (e.g. v1.0.1) to build the zip, attach it to a GitHub release and,
# once the store listing exists, submit it to Edge Add-ons.
on:
  push:
    tags: ["v*"]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Tag must match manifest version
        run: |
          v=$(node -p "require('./manifest.json').version")
          [ "v$v" = "$GITHUB_REF_NAME" ] || { echo "Tag $GITHUB_REF_NAME != manifest version $v"; exit 1; }
      - run: npm test
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: extension
          path: dist/*.zip
      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/*.zip --generate-notes --verify-tag

  edge:
    # Skipped until the repo variable EDGE_PRODUCT_ID is set (after the first, manual store submission).
    needs: build
    if: vars.EDGE_PRODUCT_ID != ''
    runs-on: ubuntu-latest
    environment: edge-add-ons
    permissions: {}
    concurrency:
      group: edge-add-ons
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/download-artifact@v4
        with:
          name: extension
          path: dist
      - name: Submit to Edge Add-ons
        env:
          EDGE_CLIENT_ID: ${{ secrets.EDGE_CLIENT_ID }}
          EDGE_API_KEY: ${{ secrets.EDGE_API_KEY }}
          EDGE_PRODUCT_ID: ${{ vars.EDGE_PRODUCT_ID }}
        run: node scripts/publish-edge.mjs dist/*.zip
