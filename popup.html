<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="ui.css">
<style>
  body { width: 300px; background: var(--card); }
  header { display: flex; align-items: center; gap: 10px; padding: 12px 16px; }
  header img { width: 20px; height: 20px; }
  header .title { flex: 1; font-weight: 600; }
  .body { padding: 16px; border-top: 1px solid var(--divider); }
  #count { font-weight: 600; font-size: 15px; }
  #close { width: 100%; margin-top: 12px; }
  .paused-note { display: none; margin-top: 10px; font-size: 12.5px; color: var(--muted); }
  body.paused .paused-note { display: block; }
  footer { display: flex; justify-content: flex-end; padding: 4px 8px; border-top: 1px solid var(--divider); }
</style>
</head>
<body>
  <header>
    <img src="icons/icon32.png" alt="">
    <label class="title" for="enabled">Tab Dedupe</label>
    <input type="checkbox" class="switch" id="enabled" title="Switch to existing tabs">
  </header>
  <div class="body">
    <div id="count">Counting duplicates…</div>
    <div class="desc">Keeps the most recently used tab in each group.</div>
    <button id="close" class="primary">Close duplicates now</button>
    <div class="paused-note">Paused: duplicate tabs open normally.</div>
  </div>
  <footer>
    <button id="settings" class="subtle">
      <svg class="i" viewBox="0 0 16 16"><circle cx="8" cy="8" r="2.2"/><path d="M8 1.8v1.6M8 12.6v1.6M1.8 8h1.6M12.6 8h1.6M3.6 3.6l1.1 1.1M11.3 11.3l1.1 1.1M3.6 12.4l1.1-1.1M11.3 4.7l1.1-1.1"/></svg>
      Settings
    </button>
  </footer>
  <script type="module" src="popup.js"></script>
</body>
</html>
